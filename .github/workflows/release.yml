name: Release

# A push whose commit message reads "Release: X.Y.Z" builds the win64 package and publishes it.
# A manual run builds the same package; the "release" input decides whether it is published.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release for this run"
        type: boolean
        default: false
      version:
        description: "Version to build, for example 0.4.1 (required when release is enabled)"
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Decide the version and whether to release
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT: ${{ inputs.release }}
          VERSION_INPUT: ${{ inputs.version }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          shopt -s nocasematch
          # The same pattern the auto-release action is given below.
          pattern='^Release:[[:space:]]*v?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$'
          release=false
          version=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "${RELEASE_INPUT:-}" = "true" ] && release=true
            version="${VERSION_INPUT:-}"
          else
            while IFS= read -r message; do
              if [[ "$message" =~ $pattern ]]; then
                version="${BASH_REMATCH[1]}"
                release=true
                break
              fi
            done < <(printf '%s' "${COMMITS:-}" | jq -r '.[]?.message // empty')
          fi

          if [ "$release" = "true" ] && [ -z "$version" ]; then
            echo "::error::No version found. Use a 'Release: X.Y.Z' commit message or set the version input."
            exit 1
          fi
          [ -n "$version" ] || version="0.0.0"

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release version=$version"

  build:
    name: Build the win64 package
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
          # The project is built with winlibs GCC 15.2 (see README); MSYS2's rolling GCC is newer and does
          # not build these libraries, so the compiler is installed separately below.

      - name: Install the project's GCC 15.2 toolchain
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-14.0.0-ucrt-r7/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip"
          $zip = "$env:RUNNER_TEMP\winlibs.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "C:\winlibs" -Force
          $gxx = Get-ChildItem "C:\winlibs" -Recurse -Filter g++.exe | Select-Object -First 1
          if (-not $gxx) { throw "g++.exe was not found in the winlibs archive" }
          $bin = $gxx.DirectoryName
          "WINLIBS_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          # MSYS2 bash prepends its own directories to PATH, so the compiler's bin is put first in each step.
          $msys = "/" + $bin.Substring(0, 1).ToLower() + $bin.Substring(2).Replace('\', '/')
          "WINLIBS_BIN_MSYS=$msys" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "CC=$bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "CXX=$bin\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $version = (& $gxx --version | Select-Object -First 1)
          Write-Output $version
          if ($version -notmatch '15\.2\.0') { throw "Expected GCC 15.2.0, got: $version" }
          # Prove the toolchain works without winlibs on PATH: Configure must keep its own library path so that
          # CMake's bundled curl keeps its certificate store when it downloads FFmpeg.
          $test = Join-Path $env:RUNNER_TEMP "winlibs-check"
          New-Item -ItemType Directory -Force $test | Out-Null
          Set-Content -Path "$test\check.cpp" -Value "int main() { return 0; }"
          & "$bin\g++.exe" "$test\check.cpp" -o "$test\check.exe"
          if ($LASTEXITCODE -ne 0) { throw "winlibs g++ could not compile a test program" }
          & "$test\check.exe"
          if ($LASTEXITCODE -ne 0) { throw "winlibs test program failed to run" }

      - name: Configure
        shell: msys2 {0}
        run: |
          set -o pipefail
          if cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log; then
            exit 0
          fi
          message=""
          while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/}
            message+="${line:0:500}%0A"
          done < <(tail -n 60 configure.log)
          echo "::error::Configure failed. Last 60 log lines:%0A${message}"
          exit 1

      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$WINLIBS_BIN_MSYS:$PATH"
          set -o pipefail
          if cmake --build build --target libs relinker SonsOfSparta-PS5 2>&1 | tee build.log; then
            exit 0
          fi
          # A failed build's log is only readable by repository admins, so the relevant lines are repeated as
          # one annotation: those are public on a public repository and show which command failed and why.
          grep -a -B2 -A6 -E 'error:|undefined reference|FAILED:|cannot find|ld\.exe:|collect2:|fatal error|CMake Error' build.log > errors.log || true
          [ -s errors.log ] || tail -n 60 build.log > errors.log
          message=""
          while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/}
            message+="${line:0:500}%0A"
          done < errors.log
          echo "::error::Build failed:%0A${message}"
          exit 1

      - name: Package the win64 download
        shell: pwsh
        run: |
          $env:PATH = "$env:WINLIBS_BIN;$env:PATH"
          $version = "${{ needs.plan.outputs.version }}"
          ./tools/package.ps1 -Version $version
          $name = "SonsOfSparta-PS5-Native-$version-win64"
          Compress-Archive -Path "release/$name" -DestinationPath "release/$name.zip" -Force

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: SonsOfSparta-PS5-Native-win64
          path: release/SonsOfSparta-PS5-Native-*-win64.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # GITHUB_TOKEN is the variable Auto Release reads, and the gh CLI authenticates with it too,
      # so this single value covers every command in this job.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: SonsOfSparta-PS5-Native-win64
          path: dist

      - name: Check that gh is authenticated
        run: gh auth status

      - name: Prepare the release notes
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Only this version's section becomes the release body: its heading and everything after it, up to the
          # next section heading. The changelog's own preamble follows the oldest section, so it is never included.
          awk -v heading="## v$VERSION" '
            index($0, heading) == 1 { capture = 1; print; next }
            capture && /^## / { capture = 0 }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for v$VERSION"
            exit 1
          fi
          cat release-notes.md

      - name: Create the release from the commit message
        id: auto-release
        if: github.event_name == 'push'
        uses: CupOfTea696/gh-action-auto-release@v1.0.2
        with:
          title: "SonsOfSparta-PS5-Native $version"
          tag: "v$semver"
          # The prepared file holds a single section, so the body is exactly this version's notes.
          changelog: release-notes.md
          regex: '/^Release:\s*#{semver}$/i'

      - name: Create the release for a manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --title "SonsOfSparta-PS5-Native $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

      - name: Upload the win64 package
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release upload "v$VERSION" dist/*.zip --clobber
